<main class="page-main">
  <section class="content-wrapper" [class.content-wrapper-edit]="mode() === 'edit'">
    @if (mode() === 'view') {
      @if (document(); as currentDocument) {
        @if (currentDocument.exists === false) {
          <app-document-exists
            [canWrite]="canWrite()"
            [hasChildren]="currentDocument.children.length > 0"
            [metadata]="currentDocument.metadata"
          />
        } @else {
          <app-document-viewer
            [metadata]="currentDocument.metadata"
            [content]="currentDocument.content"
            [attachments]="currentDocument.attachments"
          />
        }
      } @else {
        <p>{{ 'document.loading' | localized }}</p>
      }
    }
    @if (mode() === 'edit') {
      <app-document-editor
        [raw]="editorRaw()"
        [documentPath]="document()?.metadata?.path ?? ''"
        [documentExists]="document()?.exists === true"
        [isSaving]="isSaving()"
        [insertRequest]="editorInsertRequest()"
        [pastedImageRequest]="editorPastedImageRequest()"
        (rawChanged)="onEditorRawChange($event)"
        (insertRequestApplied)="onEditorInsertRequestApplied($event)"
        (pastedImageRequestApplied)="onEditorPastedImageRequestApplied($event)"
        (initialDocumentSaveRequested)="onEditorInitialDocumentSaveRequested($event)"
      />
    }
  </section>
</main>
