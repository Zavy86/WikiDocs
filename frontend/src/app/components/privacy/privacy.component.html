<ng-template #modal>
  <h4 mat-dialog-title>{{ 'privacy.title' | localized }}</h4>
  <mat-dialog-content>
    <p class="privacy-text">{{ privacy() }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="disagree()">{{ 'privacy.disagree' | localized }}</button>
    <button mat-flat-button color="primary" type="button" (click)="agree()">{{ 'common.actions.agree' | localized }}</button>
  </mat-dialog-actions>
</ng-template>
