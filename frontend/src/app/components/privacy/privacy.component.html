<ng-template #modal>
  <h4 mat-dialog-title>Privacy Policy and Cookie Agreement</h4>
  <mat-dialog-content>
    <p class="privacy-text">{{ privacy() }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="disagree()">Disagree</button>
    <button mat-flat-button color="primary" type="button" (click)="agree()">Agree</button>
  </mat-dialog-actions>
</ng-template>
