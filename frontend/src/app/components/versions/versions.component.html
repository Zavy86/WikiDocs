<h2 mat-dialog-title class="dialog-title app-dialog-title">
  <span>{{ 'versions.title' | localized }}</span>
  <button
    mat-icon-button
    type="button"
    class="app-dialog-close-button"
    [disabled]="isLoading() || deletingTimestamp() !== null"
    (click)="close()"
    [attr.aria-label]="'versions.close-label' | localized"
  >
    <mat-icon>close</mat-icon>
  </button>
</h2>
<mat-dialog-content class="dialog-content">
  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  }
  @if (versions().length === 0) {
    <p class="empty-message">{{ 'versions.empty' | localized }}</p>
  } @else {
    <mat-list>
      @for (timestamp of versions(); track timestamp) {
        <mat-list-item class="version-list-item">
          <div class="version-row">
            <button mat-button color="primary" type="button" [disabled]="isLoading() || deletingTimestamp() !== null" (click)="loadVersion(timestamp)">
              {{ formatTimestamp(timestamp) }}
            </button>
            @if (data.canDelete) {
              <button
                mat-icon-button
                color="warn"
                type="button"
                [disabled]="isLoading() || deletingTimestamp() !== null"
                (click)="requestDeleteVersion(timestamp)"
                [attr.aria-label]="'versions.delete-label' | localized"
              >
                <mat-icon>delete</mat-icon>
              </button>
            }
          </div>
        </mat-list-item>
      }
    </mat-list>
  }
</mat-dialog-content>
